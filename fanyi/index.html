<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AI 语音翻译</title>
<style>
  :root { --bg:#f6f6f4; --fg:#1a1a1a; --muted:#888; --card:#fff; --me:#2563eb; --other:#16a34a; --line:#e4e4e0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141414; --fg:#eee; --muted:#888; --card:#1f1f1f; --line:#2c2c2c; } }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  body { display:flex; flex-direction:column; max-width:640px; margin:0 auto; }
  header { display:flex; gap:8px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  select { flex:1; min-width:0; font-size:16px; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  .icon { border:none; background:none; font-size:20px; color:var(--muted); cursor:pointer; padding:4px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:85%; background:var(--card); border-radius:14px; padding:10px 14px; border:1px solid var(--line); }
  .msg.me { align-self:flex-end; border-color:var(--me); }
  .msg.other { align-self:flex-start; border-color:var(--other); }
  .src { font-size:14px; color:var(--muted); }
  .dst { font-size:20px; margin-top:4px; line-height:1.4; cursor:pointer; }
  .dst::after { content:" 🔊"; font-size:14px; }
  .tag { font-size:11px; color:var(--muted); margin-top:4px; }
  .hint { text-align:center; color:var(--muted); font-size:14px; margin:auto; line-height:1.8; }
  #live { min-height:24px; padding:0 16px 6px; color:var(--muted); font-size:15px; text-align:center; }
  .inputrow { padding:0 16px; }
  #txt { width:100%; font-size:17px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--fg); resize:none; font-family:inherit; }
  footer { display:flex; gap:12px; padding:12px 16px 20px; }
  footer button { flex:1; font-size:18px; padding:18px 0; border:none; border-radius:14px; color:#fff; cursor:pointer; user-select:none; -webkit-user-select:none; }
  #btnGo { background:var(--me); font-size:22px; padding:22px 0; }
  .lbl { font-size:16px; white-space:nowrap; }
  footer button.on { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }
</style>
</head>
<body>
<header>
  <span class="lbl">中文 ⇄</span>
  <select id="otherLang" aria-label="外语"></select>
  <button class="icon" id="ttsBtn" title="朗读开关">🔊</button>
  <button class="icon" id="setBtn" title="设置 AI 接口">⚙</button>
</header>
<div id="log"><div class="hint" id="hint">按下面的🎤说话<br>说中文翻成外语，说外语翻成中文<br>翻译完自动读出来</div></div>
<div id="live"></div>
<div class="inputrow">
  <textarea id="txt" rows="2" placeholder="安卓手机：点这里用输入法的🎤说话，再点下面按钮"></textarea>
</div>
<footer>
  <button id="btnGo">🎤 点我说话</button>
</footer>
<audio id="player" preload="none"></audio>

<script>
// ====== AI 接口（和 aichat 用的是同一个网关，可点 ⚙ 修改）======
const DEFAULT_API = "https://george-promoting-nationally-vary.trycloudflare.com";
const DEFAULT_KEY = "mindflow2026";

const LANGS = [
  ["zh-CN","中文"],["en-US","English"],["ja-JP","日本語"],["ko-KR","한국어"],
  ["fr-FR","Français"],["de-DE","Deutsch"],["es-ES","Español"],["ru-RU","Русский"],
  ["th-TH","ไทย"],["vi-VN","Tiếng Việt"],["id-ID","Bahasa Indonesia"],["ar-SA","العربية"],
  ["it-IT","Italiano"],["pt-BR","Português"],["zh-TW","繁體中文"]
];
const NAME = Object.fromEntries(LANGS);
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const otherLang = $("otherLang");
for (const [v,n] of LANGS) if (v !== "zh-CN") otherLang.add(new Option(n, v));
otherLang.value = store.get("other", "en-US");
otherLang.onchange = () => store.set("other", otherLang.value);
// 判断是不是中文（有汉字、且没有日文假名/韩文）
const isChinese = t => /[一-鿿]/.test(t) && !/[぀-ヿ가-힯]/.test(t);

let ttsOn = store.get("tts", true);
const drawTts = () => $("ttsBtn").textContent = ttsOn ? "🔊" : "🔇";
drawTts();
$("ttsBtn").onclick = () => { ttsOn = !ttsOn; store.set("tts", ttsOn); drawTts(); if (!ttsOn) stopSpeak(); };

let api = store.get("api", { url: DEFAULT_API, key: DEFAULT_KEY });
$("setBtn").onclick = () => {
  const url = prompt("AI 接口地址（OpenAI 兼容，留空恢复默认）", api.url);
  if (url === null) return;
  const key = prompt("接口密钥 Key", api.key);
  api = { url: (url.trim() || DEFAULT_API).replace(/\/+$/, ""), key: key === null ? api.key : key.trim() };
  if (!url.trim()) api.key = DEFAULT_KEY;
  store.set("api", api);
};

// ====== 翻译：先用 AI 大模型，失败自动换普通机翻 ======
function withTimeout(ms) { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; }

async function aiTranslate(text, from, to) {
  const r = await fetch(api.url + "/v1/chat/completions", {
    method: "POST", signal: withTimeout(12000),
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + api.key },
    body: JSON.stringify({
      model: "auto", temperature: 0.3, max_tokens: 800,
      messages: [
        { role: "system", content: `你是同声传译。把用户说的话从${NAME[from]}翻译成${NAME[to]}。这是口语对话，译文要自然、口语化、简洁。只输出译文，不要解释，不要引号，不要拼音。` },
        { role: "user", content: text }
      ]
    })
  });
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  let out = j.choices[0].message.content || "";
  out = out.replace(/<think>[\s\S]*?<\/think>/g, "").trim();
  if (!out) throw new Error("empty");
  return out;
}

const short = l => l.startsWith("zh") ? l : l.split("-")[0];
async function mtTranslate(text, from, to) {
  try {
    const u = `https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=${short(from)}&tl=${short(to)}&q=${encodeURIComponent(text)}`;
    const j = await (await fetch(u, { signal: withTimeout(4000) })).json();
    return j[0].map(x => x[0]).join("");
  } catch {
    const u = `https://api.mymemory.translated.net/get?langpair=${from}|${to}&q=${encodeURIComponent(text)}`;
    const j = await (await fetch(u, { signal: withTimeout(8000) })).json();
    return j.responseData.translatedText;
  }
}

async function translate(text, from, to) {
  try { return { text: await aiTranslate(text, from, to), by: "AI 翻译" }; }
  catch (e) { console.warn("AI 失败，改用机翻", e); return { text: await mtTranslate(text, from, to), by: "机器翻译（AI 接口暂时连不上）" }; }
}

// ====== 朗读：有系统语音就用系统的，没有就用在线语音（国内可用）======
const player = $("player");
let voices = [];
const loadVoices = () => { try { voices = speechSynthesis.getVoices(); } catch {} };
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const hasVoice = lang => voices.some(v => v.lang.replace("_","-").toLowerCase().startsWith(short(lang).toLowerCase().split("-")[0]));

// 手机浏览器要求声音必须由点击触发：点按钮时先“解锁”播放器
function unlockAudio() {
  try { player.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="; player.play().catch(() => {}); } catch {}
}
function stopSpeak() { try { speechSynthesis.cancel(); } catch {} try { player.pause(); } catch {} }

const BAIDU = { "zh-CN":"zh","zh-TW":"cht","en-US":"en","ja-JP":"jp","ko-KR":"kor","fr-FR":"fra","de-DE":"de","es-ES":"spa","ru-RU":"ru","th-TH":"th","vi-VN":"vie","ar-SA":"ara","it-IT":"it","pt-BR":"pt","id-ID":"id" };
const YOUDAO = { "en-US":"eng","ja-JP":"jap","ko-KR":"ko","fr-FR":"fr","zh-CN":"zh" };
function onlineUrls(text, lang) {
  const q = encodeURIComponent(text.slice(0, 300));
  const list = [];
  if (YOUDAO[lang]) list.push(`https://dict.youdao.com/dictvoice?audio=${q}&le=${YOUDAO[lang]}`);
  if (BAIDU[lang]) list.push(`https://fanyi.baidu.com/gettts?lan=${BAIDU[lang]}&text=${q}&spd=5&source=web`);
  list.push(`https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=${short(lang)}&q=${q}`);
  return list;
}
function playOnline(text, lang) {
  const urls = onlineUrls(text, lang); let i = 0;
  const next = () => {
    if (i >= urls.length) { $("live").textContent = "朗读失败：网络语音连不上"; return; }
    player.onerror = next;
    player.src = urls[i++];
    player.play().catch(() => {});
  };
  next();
}
function speak(text, lang) {
  if (!ttsOn) return;
  stopSpeak();
  if (window.speechSynthesis && hasVoice(lang)) {
    try {
      const u = new SpeechSynthesisUtterance(text); u.lang = lang;
      u.voice = voices.find(v => v.lang.replace("_","-") === lang) || voices.find(v => v.lang.replace("_","-").toLowerCase().startsWith(short(lang).toLowerCase().split("-")[0]));
      let started = false;
      u.onstart = () => started = true;
      u.onerror = () => { if (!started) playOnline(text, lang); };
      speechSynthesis.speak(u);
      setTimeout(() => { if (!started && !speechSynthesis.speaking) { speechSynthesis.cancel(); playOnline(text, lang); } }, 1500);
      return;
    } catch {}
  }
  playOnline(text, lang);
}

// ====== 界面 ======
function addMsg(src, zh) {
  $("hint")?.remove();
  const d = document.createElement("div"); d.className = "msg " + (zh ? "me" : "other");
  d.innerHTML = `<div class="src"></div><div class="dst">AI 翻译中…</div><div class="tag"></div>`;
  d.querySelector(".src").textContent = src;
  $("log").appendChild(d); $("log").scrollTop = 1e9;
  return d;
}

// 自动判断方向：中文 → 外语，外语 → 中文
async function doTranslate(text) {
  const zh = isChinese(text);
  const from = zh ? "zh-CN" : otherLang.value, to = zh ? otherLang.value : "zh-CN";
  nextListen = zh ? otherLang.value : "zh-CN";   // 对话轮流：下次听另一种语言
  const d = addMsg(text, zh);
  try {
    const r = await translate(text, from, to);
    const dst = d.querySelector(".dst"); dst.textContent = r.text;
    d.querySelector(".tag").textContent = r.by;
    dst.onclick = () => { unlockAudio(); speak(r.text, to); };
    $("log").scrollTop = 1e9;
    speak(r.text, to);
  } catch { d.querySelector(".dst").textContent = "翻译失败，请检查网络"; }
}

// ====== 语音识别 ======
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const btn = $("btnGo");
let rec = null, srBroken = !SR, nextListen = null;

function useKeyboard(msg) {
  srBroken = true;
  $("live").textContent = msg || "点上面输入框，用输入法的🎤说话，再点按钮翻译";
  $("txt").focus();
}
function resetBtn() { btn.classList.remove("on"); btn.textContent = "🎤 点我说话"; rec = null; }

btn.onclick = () => {
  unlockAudio();
  if (rec) { rec.stop(); return; }
  const typed = $("txt").value.trim();
  if (typed) { $("txt").value = ""; $("live").textContent = ""; doTranslate(typed); return; }
  if (srBroken) { useKeyboard(); return; }
  stopSpeak();
  const lang = nextListen || otherLang.value;
  rec = new SR(); rec.lang = lang; rec.interimResults = true; rec.continuous = false;
  btn.classList.add("on"); btn.textContent = "⏹ 说完点我";
  $("live").textContent = "正在听（" + NAME[lang] + "）…";
  let finalText = "", failed = false;
  rec.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    $("live").textContent = finalText + interim;
  };
  rec.onerror = e => {
    if (e.error === "no-speech") { $("live").textContent = "没听到声音，再点一次"; nextListen = lang === "zh-CN" ? otherLang.value : "zh-CN"; return; }
    if (e.error === "aborted") return;
    failed = true;
    if (e.error === "not-allowed") { $("live").textContent = "请允许使用麦克风"; return; }
    useKeyboard("这个浏览器不能直接识别语音：点上面输入框，用输入法的🎤说话，再点按钮");
  };
  rec.onend = () => {
    resetBtn();
    const text = finalText.trim(); if (!text || failed) return;
    $("live").textContent = "";
    doTranslate(text);
  };
  try { rec.start(); } catch { resetBtn(); useKeyboard(); }
};
</script>
</body>
</html>
