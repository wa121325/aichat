<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AI 语音对话</title>
<style>
  :root { --bg:#f6f6f4; --fg:#1a1a1a; --muted:#888; --card:#fff; --line:#e4e4e0; --accent:#2563eb; --user:#e8efff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141414; --fg:#eee; --card:#1f1f1f; --line:#2c2c2c; --user:#1d2a44; } }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  body { display:flex; flex-direction:column; max-width:640px; margin:0 auto; }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
  header b { font-size:17px; }
  .icon { border:none; background:none; font-size:22px; color:var(--muted); cursor:pointer; padding:4px 6px; }
  #log { flex:1; overflow-y:auto; padding:8px 16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; line-height:1.5; font-size:17px; white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:var(--user); }
  .msg.ai { align-self:flex-start; background:var(--card); border:1px solid var(--line); cursor:pointer; }
  .hint { margin:auto; text-align:center; color:var(--muted); line-height:1.9; font-size:15px; }
  #status { text-align:center; color:var(--muted); min-height:22px; font-size:15px; padding:6px 16px; }
  .center { display:flex; justify-content:center; padding:8px 0 28px; }
  #orb { width:110px; height:110px; border-radius:50%; border:none; background:var(--accent); color:#fff;
    font-size:40px; cursor:pointer; box-shadow:0 6px 24px rgba(37,99,235,.35); }
  #orb.listen { animation:breathe 1.4s infinite; }
  #orb.think { background:#9ca3af; animation:breathe .5s infinite; }
  #orb.speak { background:#16a34a; animation:breathe .8s infinite; }
  @keyframes breathe { 50% { transform:scale(1.08); } }
  #panel { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; justify-content:center; }
  #panel.show { display:flex; }
  .sheet { background:var(--card); width:100%; max-width:640px; border-radius:18px 18px 0 0; padding:20px 16px 28px; }
  .sheet h3 { margin:0 0 12px; }
  .sheet label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  .sheet input, .sheet textarea { width:100%; font-size:16px; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font-family:inherit; }
  .sheet .row { display:flex; gap:10px; margin-top:18px; }
  .sheet button { flex:1; font-size:16px; padding:12px; border-radius:10px; border:none; cursor:pointer; }
  .sheet .ok { background:var(--accent); color:#fff; }
  .sheet .note { font-size:13px; color:var(--muted); margin-top:10px; line-height:1.6; }
  .sheet a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <button class="icon" id="clearBtn" title="新对话">🗑</button>
  <b>AI 语音对话</b>
  <button class="icon" id="setBtn" title="设置">⚙</button>
</header>
<div id="log"><div class="hint" id="hint">点下面的圆按钮开始说话<br>说完停一下，AI 会用语音回答<br>回答完会自动继续听你说<br>再点一下按钮结束对话</div></div>
<div id="status"></div>
<div class="center"><button id="orb">🎤</button></div>

<div id="panel">
  <div class="sheet">
    <h3>设置</h3>
    <label>API Key（必填）</label>
    <input id="kKey" type="password" placeholder="sk-...">
    <label>接口地址</label>
    <input id="kUrl">
    <label>对话模型</label>
    <input id="kModel">
    <label>AI 的角色（可以不改）</label>
    <textarea id="kSys" rows="3"></textarea>
    <div class="note">默认用 <a href="https://cloud.siliconflow.cn/account/ak" target="_blank">硅基流动</a>（国内可直接访问，注册送额度）：在那里创建 API Key 粘贴进来就行。Key 只保存在你这台手机的浏览器里。</div>
    <div class="row"><button id="kCancel">取消</button><button class="ok" id="kSave">保存</button></div>
  </div>
</div>

<audio id="player" playsinline></audio>

<script>
const DEF = {
  url: "https://api.siliconflow.cn/v1",
  model: "Qwen/Qwen2.5-7B-Instruct",
  asr: "FunAudioLLM/SenseVoiceSmall",
  tts: "FunAudioLLM/CosyVoice2-0.5B",
  voice: "FunAudioLLM/CosyVoice2-0.5B:anna",
  sys: "你是一个友好的语音助手。用户是在用语音和你说话，你的回答会被读出来。所以：回答要口语化、简短（一般不超过三句话），不要用列表、表格、markdown 符号和表情。用户说什么语言就用什么语言回答。用户要你翻译时，只说出译文。"
};
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let cfg = Object.assign({ key: "" }, DEF, store.get("voicecfg", {}));

// ---------- 设置 ----------
function openSettings() {
  $("kKey").value = cfg.key; $("kUrl").value = cfg.url; $("kModel").value = cfg.model; $("kSys").value = cfg.sys;
  $("panel").classList.add("show");
}
$("setBtn").onclick = openSettings;
$("kCancel").onclick = () => $("panel").classList.remove("show");
$("kSave").onclick = () => {
  cfg.key = $("kKey").value.trim();
  cfg.url = ($("kUrl").value.trim() || DEF.url).replace(/\/+$/, "");
  cfg.model = $("kModel").value.trim() || DEF.model;
  cfg.sys = $("kSys").value.trim() || DEF.sys;
  store.set("voicecfg", cfg);
  $("panel").classList.remove("show");
  setStatus(cfg.key ? "已保存，点按钮开始说话" : "还没填 API Key");
};

// ---------- 对话记录 ----------
const HINT = $("log").innerHTML;
let history = store.get("voicehist", []);
function addBubble(role, text) {
  $("hint")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "ai");
  d.textContent = text;
  if (role !== "user") d.onclick = () => { unlockAudio(); stopAll(); speak(text); };
  $("log").appendChild(d); $("log").scrollTop = 1e9;
}
for (const m of history) addBubble(m.role, m.content);
$("clearBtn").onclick = () => { stopConversation(""); history = []; store.set("voicehist", history); $("log").innerHTML = HINT; };

const setStatus = t => $("status").textContent = t;
const orb = $("orb");
function setOrb(s) { orb.className = s; orb.textContent = { listen:"🎤", think:"…", speak:"🔊" }[s] || "🎤"; }

// ---------- 录音，静音 1.2 秒自动判断说完 ----------
let stream = null, ctx = null, analyser = null, mediaRec = null, active = false, state = "";
async function ensureMic() {
  if (stream) return;
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
  ctx.createMediaStreamSource(stream).connect(analyser);
}
function level() {
  const a = new Uint8Array(analyser.fftSize); analyser.getByteTimeDomainData(a);
  let s = 0; for (const v of a) s += (v - 128) ** 2; return Math.sqrt(s / a.length);
}

function listen() {
  if (!active) return;
  state = "listen"; setOrb("listen"); setStatus("在听…（说完停一下）");
  try { ctx.resume(); } catch {}
  const chunks = [];
  const mime = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(t => MediaRecorder.isTypeSupported?.(t)) || "";
  const mr = mediaRec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  mr.ondataavailable = e => e.data.size && chunks.push(e.data);
  let spoke = false, silentSince = 0;
  const startedAt = Date.now();
  const timer = setInterval(() => {
    if (mr.state !== "recording") return clearInterval(timer);
    const lv = level(), now = Date.now();
    if (lv > 6) { spoke = true; silentSince = 0; }
    else if (spoke) { silentSince ||= now; if (now - silentSince > 1200) mr.stop(); }
    if (!spoke && now - startedAt > 15000) mr.stop();   // 15 秒没人说话
    if (now - startedAt > 60000) mr.stop();             // 最长 60 秒
  }, 100);
  mr.onstop = () => {
    clearInterval(timer);
    if (mediaRec === mr) mediaRec = null;
    if (!active) return;
    if (!spoke) { stopConversation("没听到声音，点按钮再开始"); return; }
    handleAudio(new Blob(chunks, { type: mr.mimeType || "audio/webm" }));
  };
  mr.start(250);
}

// ---------- 识别 → AI 回答 → 朗读 ----------
async function api(path, opts) {
  const r = await fetch(cfg.url + path, { ...opts, headers: { "Authorization": "Bearer " + cfg.key, ...(opts.headers || {}) } });
  if (!r.ok) {
    let msg = String(r.status); try { const j = await r.json(); msg += " " + (j.message || j.error?.message || ""); } catch {}
    throw new Error(msg);
  }
  return r;
}

async function handleAudio(blob) {
  state = "think"; setOrb("think"); setStatus("识别中…");
  try {
    const t = blob.type, ext = t.includes("mp4") ? "m4a" : t.includes("ogg") ? "ogg" : "webm";
    const fd = new FormData(); fd.append("file", blob, "speech." + ext); fd.append("model", DEF.asr);
    const text = ((await (await api("/audio/transcriptions", { method:"POST", body:fd })).json()).text || "").trim();
    if (!active) return;
    if (!text) { listen(); return; }
    history.push({ role:"user", content:text }); addBubble("user", text);

    setStatus("思考中…");
    const r = await api("/chat/completions", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ model: cfg.model, temperature: 0.7, max_tokens: 400,
        messages: [{ role:"system", content: cfg.sys }, ...history.slice(-20)] })
    });
    let reply = (await r.json()).choices[0].message.content || "";
    reply = reply.replace(/<think>[\s\S]*?<\/think>/g, "").replace(/[*#`>|]/g, "").trim() || "嗯？";
    history.push({ role:"assistant", content:reply }); store.set("voicehist", history);
    addBubble("assistant", reply);
    if (!active) return;
    await speak(reply);
    if (active) listen();             // 读完自动继续听
  } catch (e) {
    console.warn(e);
    stopConversation(/401|403/.test(e.message) ? "API Key 不对，点 ⚙ 检查一下" :
      e.message === "Failed to fetch" ? "连不上 AI 接口，检查网络或接口地址" : "出错了：" + e.message);
  }
}

// ---------- 朗读：先用 AI 语音，失败用系统语音 ----------
const player = $("player");
let currentUrl = null;
function unlockAudio() {
  try { player.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="; player.play().catch(()=>{}); } catch {}
  try { ctx?.resume(); } catch {}
}
function playUrl(url) {
  return new Promise(res => {
    player.onended = player.onerror = player.onpause = () => res();
    player.src = url; player.play().catch(() => res());
  });
}
function systemSpeak(text) {
  return new Promise(res => {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = /[一-鿿]/.test(text) ? "zh-CN" : "en-US";
      u.onend = u.onerror = () => res(); speechSynthesis.speak(u);
      setTimeout(() => { if (!speechSynthesis.speaking) res(); }, 2000);
    } catch { res(); }
  });
}
async function speak(text) {
  state = "speak"; setOrb("speak"); setStatus("AI 在说话…（点按钮打断）");
  try {
    const r = await api("/audio/speech", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ model: DEF.tts, voice: DEF.voice, input: text.replace(/\s+/g, " "), response_format: "mp3" })
    });
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(await r.blob());
    await playUrl(currentUrl);
  } catch (e) { console.warn("AI 语音失败，用系统朗读", e); await systemSpeak(text); }
  if (!active) { state = ""; setOrb(""); setStatus(""); }
}
function stopAll() { try { player.pause(); } catch {} try { speechSynthesis.cancel(); } catch {} }

// ---------- 按钮 ----------
function stopConversation(msg) {
  active = false; state = ""; stopAll();
  if (mediaRec && mediaRec.state === "recording") { try { mediaRec.stop(); } catch {} }
  setOrb(""); setStatus(msg || "");
}
orb.onclick = async () => {
  if (!cfg.key) { openSettings(); return; }
  if (active && state === "speak") { stopAll(); return; }     // 打断 AI，马上接着听
  if (active) { stopConversation("对话已结束"); return; }
  unlockAudio();
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { setStatus("这个浏览器不支持录音，换 Chrome / Edge / Safari 试试"); return; }
  try { await ensureMic(); } catch { setStatus("请允许使用麦克风"); return; }
  active = true; listen();
};
if (!cfg.key) setStatus("先点右上角 ⚙ 填 API Key");
</script>
</body>
</html>
